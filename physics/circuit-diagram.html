      const next = clampPlacement(rotOf(item), { x: drag.origX + dx, y: drag.origY + dy });
      if (next.x !== item.x || next.y !== item.y) {
        item.x = next.x;
        item.y = next.y;
        scheduleRender();
      }
    }
  }

  function onPointerUp(evt) {
    if (!drag) return;
    if (drag.kind === 'wire') {
      const start = drag.start;
      const end = drag.end;
      drag = null;
      if (!samePoint(start, end) && isAxisAligned(start, end)) {
        addWire(start, end);
        state.wireStart = null;
      } else {
        // A tap rather than a drag: remember the start and wait for a second tap.
        state.wireStart = start;
      }
      renderAll();
      return;
    }
    if (drag.kind === 'move') {
      const before = drag.before;
      drag = null;
      if (snapshot() !== before) {
        history.push(before);
        if (history.length > 60) history.shift();
        save();
        updateToolbar();
      }
    }
  }

  function setTool(tool) {
    state.tool = tool;
    state.wireStart = null;
    els.board.style.cursor = tool === 'select' ? 'default' : 'crosshair';
    els.board.dataset.tool = tool;
    updatePalette();
    updateStatus();
  }

  function selectItem(id) {
    state.selected = id;
    updateToolbar();
    updateStatus();
  }

  function placePart(type, point) {
    if (type === 'select' || type === 'wire') return null;
    pushHistory();
    const p = clampPlacement(0, point);
    const item = createItem(type, p.x, p.y, 0);
    state.items.push(item);
    save();
    return item;
  }

  function addWire(a, b) {
    if (!a || !b) return;
    if (!isAxisAligned(a, b) || samePoint(a, b)) return;
    pushHistory();
    state.items.push({
      id: uid(), type: 'wire',
      x1: a.x, y1: a.y, x2: b.x, y2: b.y
    });
    save();
  }

  function rotateSelected() {
    const item = selectedItem();
    if (!item) return;
    if (item.type === 'wire') {
      showToast('Wires follow the grid; rotate a part instead');
      return;
    }
    pushHistory();
    item.rot = (rotOf(item) + 1) % 4;
    clampPart(item);
    renderAll();
    save();
  }

  function deleteSelected() {
    const item = selectedItem();
    if (!item) return;
    pushHistory();
    state.items = state.items.filter(function (i) { return i.id !== item.id; });
    state.selected = null;
    state.wireStart = null;
    renderAll();
    renderInspector();
    save();
  }

  function clearBoard(skipHistory) {
    if (!state.items.length && !state.selected) return;
    if (!skipHistory) pushHistory();
    state.items = [];
    state.selected = null;
    state.wireStart = null;
    drag = null;
    setTool('select');
    renderAll();
    renderInspector();
    save();
    showToast('Board cleared');
  }

  /* ============================================================
     History & storage
     ============================================================ */

  function snapshot() {
    return JSON.stringify(state.items);
  }

  function pushHistory() {
    history.push(snapshot());
    if (history.length > 60) history.shift();
    updateToolbar();
  }

  function undo() {
    if (!history.length) return;
    const previous = history.pop();
    try {
      state.items = JSON.parse(previous);
    } catch (e) {
      return;
    }
    state.selected = null;
    state.wireStart = null;
    drag = null;
    renderAll();
    renderInspector();
    save();
  }

  function sanitizeItems(raw) {
    if (!Array.isArray(raw)) return [];
    const allowed = new Set(PARTS.map(function (p) { return p[0]; }));
    const clean = [];
    for (const candidate of raw) {
      if (!candidate || typeof candidate !== 'object') continue;
      if (!allowed.has(candidate.type) || candidate.type === 'select') continue;
      const item = {
        id: typeof candidate.id === 'string' && candidate.id ? candidate.id : uid(),
        type: candidate.type,
        x: Number(candidate.x),
        y: Number(candidate.y),
        rot: Number(candidate.rot)
      };
      item.rot = ((Math.round(item.rot) || 0) % 4 + 4) % 4;

      if (item.type === 'wire') {
        item.x1 = Number(candidate.x1);
        item.y1 = Number(candidate.y1);
        item.x2 = Number(candidate.x2);
        item.y2 = Number(candidate.y2);
        if (![item.x1, item.y1, item.x2, item.y2].every(Number.isFinite)) continue;
        if (item.x1 !== item.x2 && item.y1 !== item.y2) continue;
        if (item.x1 === item.x2 && item.y1 === item.y2) continue;
        item.x1 = clamp(Math.round(item.x1), 0, COLS);
        item.x2 = clamp(Math.round(item.x2), 0, COLS);
        item.y1 = clamp(Math.round(item.y1), 0, ROWS);
        item.y2 = clamp(Math.round(item.y2), 0, ROWS);
        clean.push(item);
        continue;
      }

      if (!Number.isFinite(item.x) || !Number.isFinite(item.y)) continue;

      item.x = clamp(Math.round(item.x), 0, COLS);
      item.y = clamp(Math.round(item.y), 0, ROWS);
      if (item.type === 'battery') {
        item.mode = candidate.mode === 'current' ? 'current' : 'voltage';
        item.volts = clamp(Number(candidate.volts) || 0, 0, 1000);
        item.amps = clamp(Number(candidate.amps) || 0, 0, 1000);
      } else if (item.type === 'resistor') {
        item.ohms = clamp(Number(candidate.ohms) || 0.01, 0.01, 1000000);
      } else if (item.type === 'switch') {
        item.closed = candidate.closed !== false;
      }
      clean.push(item);
    }
    return clean;
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        v: 3,
        cols: COLS,
        rows: ROWS,
        mode: state.mode,
        realism: state.realism,
        items: state.items
      }));
    } catch (e) { /* private mode etc. */ }
  }

  function load() {
    let raw = null;
    try {
      raw = localStorage.getItem(STORE_KEY);
    } catch (e) {
      raw = null;
    }
    if (!raw) return false;

    let parsed = null;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      parsed = null;
    }
    if (!parsed || typeof parsed !== 'object') {
      state.items = [];
      return true;
    }

    COLS = clamp(Math.round(Number(parsed.cols) || DEFAULT_SIZE.cols), SIZE_LIMITS.cols[0], SIZE_LIMITS.cols[1]);
    ROWS = clamp(Math.round(Number(parsed.rows) || DEFAULT_SIZE.rows), SIZE_LIMITS.rows[0], SIZE_LIMITS.rows[1]);
    state.mode = parsed.mode === 'draw' ? 'draw' : 'sim';
    state.realism = parsed.realism === 'realistic' ? 'realistic' : 'ideal';
    state.items = sanitizeItems(parsed.items);
    return true;
  }

  /* ============================================================
     Example circuit
     ============================================================ */

  function loadExample(withHistory) {
    if (withHistory) pushHistory();
    const items = [];
    function add(type, x, y, rot, extra) {
      const item = createItem(type, x, y, rot);
      if (extra) Object.assign(item, extra);
      items.push(item);
      return item;
    }
    function wire(x1, y1, x2, y2) {
      items.push({ id: uid(), type: 'wire', x1: x1, y1: y1, x2: x2, y2: y2 });
    }

    add('battery', 2, 7, 3, { volts: 9, mode: 'voltage' });
    add('resistor', 6, 3, 0, { ohms: 100 });
    add('switch', 6, 11, 0, { closed: true });
    add('ammeter', 10, 7, 1);
    add('voltmeter', 6, 7, 0);
    add('arrow', 8, 2, 0);

    wire(2, 6, 2, 3);
    wire(2, 3, 5, 3);
    wire(7, 3, 10, 3);
    wire(10, 3, 10, 6);
    wire(10, 8, 10, 11);
    wire(10, 11, 7, 11);
    wire(5, 11, 2, 11);
    wire(2, 11, 2, 8);
    wire(5, 7, 5, 3);
    wire(7, 7, 7, 3);

    state.items = items;
    state.selected = null;
    state.wireStart = null;
    setTool('select');
    save();
    renderAll();
    renderInspector();
  }

  /* ============================================================
     Theme
     ============================================================ */

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#09140f' : '#005A36');
    els.themeBtn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    els.themeBtn.title = els.themeBtn.getAttribute('aria-label');
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* noop */ }
  }

  function toggleTheme() {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  }

  /* ============================================================
     Wire up UI
     ============================================================ */

  function buildPalette() {
    els.palette.innerHTML = PARTS.map(function (part) {
      const type = part[0];
      const name = part[1];
      const pressed = state.tool === type;
      return '<button class="part-btn" type="button" data-tool="' + type + '" ' +
        'aria-pressed="' + (pressed ? 'true' : 'false') + '" ' +
        'title="' + HINTS[type] + '" aria-label="' + name + ': ' + HINTS[type] + '">' +
        paletteIcon(type) + '<span>' + name + '</span></button>';
    }).join('');
  }

  function bindEvents() {
    els.board.addEventListener('pointerdown', onPointerDown);
    els.board.addEventListener('pointermove', onPointerMove);
    els.board.addEventListener('pointerup', onPointerUp);
    els.board.addEventListener('pointercancel', onPointerUp);
    els.board.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    els.palette.addEventListener('click', function (event) {
      const btn = event.target.closest('[data-tool]');
      if (!btn) return;
      const tool = btn.dataset.tool;
      setTool(state.tool === tool ? 'select' : tool);
      if (state.tool === 'select') {
        renderAll();
      } else {
        renderDraft();
        updatePalette();
        updateStatus();
      }
    });

    els.themeBtn.addEventListener('click', toggleTheme);

    document.querySelectorAll('[data-mode-tab]').forEach(function (btn) {
      btn.addEventListener('click', function () { setMode(btn.dataset.modeTab); });
    });
    document.querySelectorAll('[data-realism]').forEach(function (btn) {
      btn.addEventListener('click', function () { setRealism(btn.dataset.realism); });
    });

    if (els.sizeBtn) {
      els.sizeBtn.addEventListener('click', function (event) {
        event.stopPropagation();
        setSizePanel(els.sizePop.hidden);
      });
      els.sizePop.addEventListener('click', function (event) {
        const btn = event.target.closest('[data-size]');
        if (!btn) return;
        const dim = btn.dataset.size;
        const delta = Number(btn.dataset.delta) || 0;
        setBoardSize(dim === 'cols' ? COLS + delta : COLS, dim === 'rows' ? ROWS + delta : ROWS, true);
      });
      els.sizeReset.addEventListener('click', function () {
        setBoardSize(DEFAULT_SIZE.cols, DEFAULT_SIZE.rows);
      });
      document.addEventListener('pointerdown', function (event) {
        if (els.sizePop.hidden) return;
        if (els.sizePop.contains(event.target) || els.sizeBtn.contains(event.target)) return;
        setSizePanel(false);
      });
    }

    els.undoBtn.addEventListener('click', undo);
    els.rotateBtn.addEventListener('click', rotateSelected);
    els.deleteBtn.addEventListener('click', deleteSelected);

    els.clearBtn.addEventListener('click', function () {
      if (!state.items.length) {
        showToast('The board is already empty');
        return;
      }
      if (!clearArmed) {
        clearArmed = true;
        updateToolbar();
        showToast('Tap the clear button again to remove everything');
        clearTimeout(clearTimer);
        clearTimer = setTimeout(function () {
          clearArmed = false;
          updateToolbar();
        }, 3200);
        return;
      }
      clearArmed = false;
      clearTimeout(clearTimer);
      clearBoard(false);
    });

    document.addEventListener('keydown', function (event) {
      const target = event.target;
      const typing = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
      if (typing) return;

      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
        event.preventDefault();
        undo();
        return;
      }
      if (event.key === 'Delete' || event.key === 'Backspace') {
        if (state.selected) {
          event.preventDefault();
          deleteSelected();
        }
        return;
      }
      if (event.key === 'Escape') {
        if (els.sizePop && !els.sizePop.hidden) {
          setSizePanel(false);
          els.sizeBtn.focus({ preventScroll: true });
          return;
        }
        setTool('select');
        selectItem(null);
        renderAll();
        return;
      }
      if (event.key.toLowerCase() === 'r') {
        rotateSelected();
      }
    });
  }

  /* ============================================================
     Init
     ============================================================ */

  function init() {
    els.board.dataset.tool = state.tool;
    buildPalette();
    bindEvents();
    applyTheme(currentTheme());

    const hadSavedBoard = load();
    applyBoardSize();
    updateModeControls();
    if (!hadSavedBoard) {
      loadExample(false);
      setTimeout(function () { showToast('Sample circuit loaded — edit it or clear the board'); }, 700);
    } else {
      renderAll();
      renderInspector();
    }
  }

  init();
})();
</script>
</body>
</html>
